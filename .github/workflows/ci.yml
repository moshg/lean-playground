name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          packages=$(find packages -mindepth 2 -maxdepth 2 -name 'lakefile.*' -printf '%h\n' \
            | xargs -n1 basename | sort -u | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Found: $packages"

  build:
    name: ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: packages/${{ matrix.package }}
          build-args: --wfail
          test: true

  # A single required check for branch protection, independent of the package list.
  ci-ok:
    name: CI OK
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` means there are no packages yet.
      - run: |
          result="${{ needs.build.result }}"
          echo "build: $result"
          test "$result" = success || test "$result" = skipped
