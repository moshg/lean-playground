name = "array-deque"
version = "0.1.0"
description = "A double-ended queue backed by a growable ring buffer over Array"
defaultTargets = ["ArrayDeque"]
testDriver = "ArrayDequeTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "ArrayDeque"
leanOptions = { linter.missingDocs = true }

# Tests: `lake test` builds and runs `ArrayDequeTest.lean`,
# which imports the `ArrayDequeTest.*` modules.
[[lean_lib]]
name = "tests"
globs = ["ArrayDequeTest.+"]

[[lean_exe]]
name = "ArrayDequeTest"
